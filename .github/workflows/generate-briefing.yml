name: Generate Morning Briefing

on:
  schedule:
    # 毎日 UTC 21:15 (JST 6:15 AM) に実行（ニュースダイジェストの直後）
    - cron: '15 21 * * *'
  workflow_dispatch:
  # 一時的な動作確認用トリガー（main マージ前に削除する）
  push:
    branches:
      - claude/mcareer-briefing-chatwork-h4yh3y

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate morning briefing
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_MCAREER_KEYWORD: ${{ vars.CHATWORK_MCAREER_KEYWORD }}
          CHATWORK_MCAREER_ROOM_IDS: ${{ vars.CHATWORK_MCAREER_ROOM_IDS }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python generate_briefing.py
